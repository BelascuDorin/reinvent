spring.application.name=reinvent

# Datasource. In local dev the spring-boot-docker-compose integration starts the
# Postgres service in compose.yaml and overrides host/port here; these values are
# the fallback and must match compose.yaml. Tests use Testcontainers instead.
spring.datasource.url=jdbc:postgresql://localhost:5432/reinvent
spring.datasource.username=reinvent
spring.datasource.password=reinvent

# Flyway is the single source of truth for the schema; Hibernate never touches it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Session cookie: HTTP-only (not readable by browser JS) and SameSite=Lax.
# Production must also set server.servlet.session.cookie.secure=true (HTTPS only);
# it is left off here so the cookie works over http://localhost in development.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Actuator health as the readiness signal.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
